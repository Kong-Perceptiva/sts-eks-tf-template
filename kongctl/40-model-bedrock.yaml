# The key-auth strategy must already exist on the selected AI Gateway.
ai_gateway_models:
  - ref: sts-bedrock-chat
    ai_gateway: !lookup {id: !env AI_GATEWAY_ID}
    type: model
    name: sts-bedrock-chat
    display_name: STS chat (Bedrock example)
    capabilities: [generate]
    formats: [{type: openai}]
    access:
      auth_strategies: [sts-key-auth]
    config:
      route:
        paths: [/v1]
        model:
          body_param: model
          values: [sts-bedrock-chat]
    targets:
      - name: !env BEDROCK_MODEL_ID
        provider: !ref bedrock#name
        config:
          type: bedrock
          region: !env AWS_REGION
    policies: []
